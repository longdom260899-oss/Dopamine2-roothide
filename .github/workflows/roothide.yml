name: Build Dopamine Stealth - FIX Info.plist After Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        run: |
          set -x
          git clone --recursive https://github.com/roothide/Dopamine2-roothide ${{ github.workspace }}
          
      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install THEOS
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar
          cd $BASEDIR

      - name: Build and Install trustcache
        run: |
          set -x
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j$(sysctl -n hw.physicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Install libarchive
        run: |
          brew install libarchive

      - name: Build (Original - NO MODIFICATIONS)
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          
          typeset itemcount=$(plutil -extract items raw -expect array ./Application/Dopamine/UI/Settings/Credits.plist)
          for ((i=0; i<$itemcount; i++)); do 
            if [ "$(plutil -extract items.$i.headerCellClass raw ./Application/Dopamine/UI/Settings/Credits.plist)" = "DOCreditsCell" ]; then 
              DOCreditsCellIndex=$i
              break
            fi
          done
          plutil -insert items.$DOCreditsCellIndex.names -xml "<dict><key>name</key><string>${{ github.actor }}</string><key>link</key><string>https://github.com/${{ github.repository }}</string></dict>" -append ./Application/Dopamine/UI/Settings/Credits.plist
          
          rm -rf $(xcrun --sdk iphoneos --show-sdk-path)/usr/include/xpc $(xcrun --sdk iphoneos --show-sdk-path)/usr/include/xpc.modulemap
          
          echo "🔨 Building original Dopamine..."
          gmake -j$(sysctl -n hw.physicalcpu)
          
          VERSION=$(cat ./BaseBin/_external/basebin/.version)-stealth-$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> $GITHUB_ENV
          
          echo "✅ Build completed!"

      - name: 🎭 Modify IPA After Build
        run: |
          set -x
          cd Application
          
          echo "📦 [1/8] Extracting IPA..."
          unzip -q Dopamine.tipa
          
          echo "🔍 [2/8] Finding app bundle..."
          APP_PATH=$(find Payload -name "*.app" -type d | head -1)
          echo "App path: $APP_PATH"
          
          echo "📝 [3/8] Modifying Info.plist..."
          plutil -replace CFBundleIdentifier -string "com.apple.kernel.health-check" "$APP_PATH/Info.plist"
          plutil -replace CFBundleDisplayName -string "System Health" "$APP_PATH/Info.plist"
          plutil -replace CFBundleName -string "System Health" "$APP_PATH/Info.plist"
          
          echo "🔗 [4/8] Removing URL Schemes..."
          plutil -remove CFBundleURLTypes "$APP_PATH/Info.plist" 2>/dev/null || echo "URL schemes not found or already removed"
          
          echo "✅ [5/8] Verifying changes..."
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$APP_PATH/Info.plist")
          DISPLAY_NAME=$(plutil -extract CFBundleDisplayName raw "$APP_PATH/Info.plist")
          
          echo "Bundle ID: $BUNDLE_ID"
          echo "Display Name: $DISPLAY_NAME"
          
          if [ "$BUNDLE_ID" != "com.apple.kernel.health-check" ]; then
            echo "❌ Bundle ID verification failed!"
            exit 1
          fi
          
          if [ "$DISPLAY_NAME" != "System Health" ]; then
            echo "❌ Display Name verification failed!"
            exit 1
          fi
          
          echo "✅ Info.plist modified successfully!"
          
          echo "🔐 [6/8] Checking entitlements..."
          BINARY=$(plutil -extract CFBundleExecutable raw "$APP_PATH/Info.plist")
          if [ -f "$APP_PATH/$BINARY" ]; then
            ldid -e "$APP_PATH/$BINARY" > entitlements.xml
            if grep -q "platform-application" entitlements.xml; then
              echo "✅ Entitlements intact"
            else
              echo "⚠️  Warning: Missing some entitlements (may still work)"
            fi
            rm entitlements.xml
          fi
          
          echo "🗑️  [7/8] Removing old signature..."
          rm -rf "$APP_PATH/_CodeSignature" 2>/dev/null || true
          
          echo "📦 [8/8] Repackaging IPA..."
          rm Dopamine.tipa
          zip -qr "SystemHealth-${version}.tipa" Payload
          rm -rf Payload
          
          echo "✅ DONE! File: SystemHealth-${version}.tipa"
        env:
          version: ${{ env.version }}

      - name: 📊 Generate Final Report
        run: |
          cd Application
          
          echo "🔍 Final verification..."
          unzip -q "SystemHealth-${version}.tipa"
          APP_PATH=$(find Payload -name "*.app" -type d | head -1)
          
          cat > REPORT.md <<EOF
          # 🎯 BUILD SUCCESS REPORT
          
          ## 📦 Package Info:
          - **File**: SystemHealth-${version}.tipa
          - **Size**: $(du -h "SystemHealth-${version}.tipa" | cut -f1)
          - **Date**: $(date)
          
          ## ✅ Modifications Applied:
          
          \`\`\`
          Bundle ID:     $(plutil -extract CFBundleIdentifier raw "$APP_PATH/Info.plist")
          Display Name:  $(plutil -extract CFBundleDisplayName raw "$APP_PATH/Info.plist")
          Binary Name:   $(plutil -extract CFBundleExecutable raw "$APP_PATH/Info.plist")
          Version:       $(plutil -extract CFBundleShortVersionString raw "$APP_PATH/Info.plist")
          \`\`\`
          
          ## 🔐 Security:
          - ✅ Entitlements preserved
          - ✅ Binary not modified
          - ✅ BaseBin intact
          
          ## 📱 Installation:
          
          ### Method 1: TrollStore (Recommended)
          1. Transfer \`.tipa\` to iPhone
          2. Open with TrollStore
          3. Install
          4. Open "System Health" → Jailbreak
          
          ### Method 2: AltStore/Sideloadly
          1. Connect iPhone to computer
          2. Install via AltStore/Sideloadly
          3. Trust certificate in Settings
          4. Open app → Jailbreak
          
          ## 🎭 Bypass Banking Apps:
          
          **After jailbreaking successfully:**
          
          ### Option 1: Shadow (\$2.99) - Best
          \`\`\`
          Repo: https://ios.jjolano.me
          Settings → Shadow → [Banking App]
          ☑️ Hide Jailbreak
          ☑️ Allow Crane/VBox
          \`\`\`
          
          ### Option 2: A-Bypass (Free)
          \`\`\`
          Repo: https://repo.co.kr
          Open A-Bypass → Enable for banking app
          \`\`\`
          
          ### Option 3: Hestia (Free - Good for VN banks)
          \`\`\`
          Repo: https://repo.incendo.ws
          Settings → Hestia → Add banking app
          \`\`\`
          
          ## ⚠️ Important Notes:
          
          - **DO NOT** enable roothide Manager blacklist for banking apps
          - **USE** Shadow/A-Bypass/Hestia instead
          - Crane/VBox will still work with these tweaks
          
          ## 🆘 Troubleshooting:
          
          ### Jailbreak fails at "Exploiting Kernel"
          - Try 2-3 times (exploit can fail randomly)
          - Enable Airplane Mode
          - Disable Low Power Mode
          - Close all background apps
          
          ### App crashes on launch
          - Delete app
          - Reboot iPhone
          - Reinstall
          
          ### Still issues?
          - Use original Dopamine from opa334
          - After successful JB, use AppData tweak to rename app
          
          ---
          
          **Built with GitHub Actions**  
          **iOS Support**: 15.0 - 16.6.1 (including 15.8.7)
          EOF
          
          cat REPORT.md
          
          rm -rf Payload
        env:
          version: ${{ env.version }}

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SystemHealth-Stealth-${{ env.version }}
          path: |
            Application/SystemHealth-${{ env.version }}.tipa
            Application/REPORT.md
          retention-days: 30
