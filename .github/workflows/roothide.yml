name: "*** build tipa file ***"

on:
  # schedule:
  #   - cron: '0 */2 * * *' # every 2 hours
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        run: |
          set -x
          git clone --recursive https://github.com/roothide/Dopamine2-roothide ${{ github.workspace }}
          
      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install THEOS
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar
          cd $BASEDIR

      - name: Build and Install trustcache
        run: |
          set -x
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j$(sysctl -n hw.physicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Set Environment Variables
        run: |
          set -x
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          TS=$(date -j -f "%Y%m%d_%H%M%S" "${T2}" +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=${T2}" >> $GITHUB_ENV
          echo "ctimestamp=${TS}" >> $GITHUB_ENV
          echo "shorthash=${SHASH}" >> $GITHUB_ENV

      - name: Install libarchive
        run: |
          brew install libarchive

      - name: Modify Bundle ID and App Name
        run: |
          set -x
          
          echo "=== Modifying Bundle ID to com.apple.kernel.health-check ==="
          
          # Sửa Bundle ID trong Makefile chính
          if [ -f "Makefile" ]; then
            gsed -i 's/BUNDLE_ID[[:space:]]*=[[:space:]]*.*/BUNDLE_ID = com.apple.kernel.health-check/g' Makefile
            gsed -i 's/PRODUCT_BUNDLE_IDENTIFIER[[:space:]]*=[[:space:]]*.*/PRODUCT_BUNDLE_IDENTIFIER = com.apple.kernel.health-check/g' Makefile
          fi
          
          # Sửa Bundle ID trong Application/Dopamine/Makefile
          if [ -f "Application/Dopamine/Makefile" ]; then
            gsed -i 's/\(.*BUNDLE_ID.*=\).*/\1 com.apple.kernel.health-check/' Application/Dopamine/Makefile
            gsed -i 's/\(.*APPLICATION_ID.*=\).*/\1 com.apple.kernel.health-check/' Application/Dopamine/Makefile
          fi
          
          # Tìm tất cả file Info.plist và sửa Bundle ID + Display Name
          echo "=== Modifying Info.plist files ==="
          find . -name "Info.plist" -type f | while read plist; do
            echo "Processing: $plist"
            
            # Sửa Bundle Identifier
            plutil -replace CFBundleIdentifier -string "com.apple.kernel.health-check" "$plist" 2>/dev/null || true
            
            # Sửa Display Name
            plutil -replace CFBundleDisplayName -string "System Health" "$plist" 2>/dev/null || true
            plutil -replace CFBundleName -string "System Health" "$plist" 2>/dev/null || true
            
            # Xóa các key liên quan đến icon
            plutil -remove CFBundleIcons "$plist" 2>/dev/null || true
            plutil -remove CFBundleIconFiles "$plist" 2>/dev/null || true
            plutil -remove CFBundleIconFile "$plist" 2>/dev/null || true
            plutil -remove CFBundleIconName "$plist" 2>/dev/null || true
          done
          
          # Xóa AppIcon trong Assets
          echo "=== Removing App Icons ==="
          find . -type d -name "AppIcon.appiconset" -exec rm -rf {} + 2>/dev/null || true
          
          # Verify changes
          echo "=== Verification ==="
          echo "Makefile Bundle IDs:"
          grep -r "BUNDLE_ID\|APPLICATION_ID" . --include="Makefile" 2>/dev/null || echo "No Makefile found"
          echo ""
          echo "Info.plist Bundle IDs:"
          find . -name "Info.plist" -type f -exec sh -c 'echo "File: $1"; plutil -p "$1" | grep -i "bundle"' _ {} \; 2>/dev/null || true

      - name: Build
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          typeset itemcount=$(plutil -extract items raw -expect array ./Application/Dopamine/UI/Settings/Credits.plist)
          for ((i=0; i<$itemcount; i++)); do if [ "$(plutil -extract items.$i.headerCellClass raw ./Application/Dopamine/UI/Settings/Credits.plist)" = "DOCreditsCell" ]; then DOCreditsCellIndex=$i; break; fi; done;
          plutil -insert items.$DOCreditsCellIndex.names -xml "<dict><key>name</key><string>${{ github.actor }}</string><key>link</key><string>https://github.com/${{ github.repository }}</string></dict>" -append ./Application/Dopamine/UI/Settings/Credits.plist
          rm -rf $(xcrun --sdk iphoneos --show-sdk-path)/usr/include/xpc $(xcrun --sdk iphoneos --show-sdk-path)/usr/include/xpc.modulemap
          gmake -j$(sysctl -n hw.physicalcpu)
          VERSION=$(cat ./BaseBin/_external/basebin/.version)-$(git rev-parse --short HEAD)
          mv ./Application/Dopamine.tipa  "./Application/roothide-Dopamine-${VERSION}.tipa"
          echo "version=${VERSION}" >> $GITHUB_ENV

      - name: Upload Artifact
        id: dopamine-latest-upload
        uses: actions/upload-artifact@v4
        with:
          name: roothide-Dopamine-${{ env.version }}.tipa
          path: |
            ${{ github.workspace }}/Application/roothide-Dopamine-${{ env.version }}.tipa
