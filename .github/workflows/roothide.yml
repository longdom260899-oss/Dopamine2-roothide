name: Build Stealth JB - Stable & Clean

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        run: |
          set -x
          git clone --recursive https://github.com/roothide/Dopamine2-roothide ${{ github.workspace }}
          
      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install THEOS
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar
          cd $BASEDIR

      - name: Build and Install trustcache
        run: |
          set -x
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j$(sysctl -n hw.physicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Install libarchive
        run: |
          brew install libarchive

      - name: 🎭 Stealth Mod - Phase 1 (BEFORE BUILD - Info.plist only)
        run: |
          set -x
          
          PLIST="./Application/Dopamine/Info.plist"
          
          echo "🎭 [1/5] Masking Bundle ID & Display Name..."
          plutil -replace CFBundleIdentifier -string "com.apple.kernel.health-check" $PLIST
          plutil -replace CFBundleDisplayName -string "System Health" $PLIST
          plutil -replace CFBundleName -string "System Health" $PLIST
          
          echo "🔗 [2/5] Removing URL Schemes..."
          plutil -remove CFBundleURLTypes $PLIST 2>/dev/null || true
          
          echo "📋 [3/5] Faking Version..."
          plutil -replace CFBundleShortVersionString -string "1.0" $PLIST
          plutil -replace CFBundleVersion -string "99.99.99" $PLIST
          
          echo "🧹 [4/5] Removing Jailbreak Metadata..."
          plutil -remove UIBackgroundModes $PLIST 2>/dev/null || true
          plutil -remove LSApplicationQueriesSchemes $PLIST 2>/dev/null || true
          plutil -remove UIFileSharingEnabled $PLIST 2>/dev/null || true
          plutil -remove UISupportsDocumentBrowser $PLIST 2>/dev/null || true
          
          echo "📱 [5/5] Faking Minimum OS..."
          plutil -replace MinimumOSVersion -string "15.0" $PLIST
          
          echo "✅ Phase 1 Complete (Safe modifications only)"

      - name: Build (Includes BaseBin)
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          
          typeset itemcount=$(plutil -extract items raw -expect array ./Application/Dopamine/UI/Settings/Credits.plist)
          for ((i=0; i<$itemcount; i++)); do 
            if [ "$(plutil -extract items.$i.headerCellClass raw ./Application/Dopamine/UI/Settings/Credits.plist)" = "DOCreditsCell" ]; then 
              DOCreditsCellIndex=$i
              break
            fi
          done
          plutil -insert items.$DOCreditsCellIndex.names -xml "<dict><key>name</key><string>${{ github.actor }}</string><key>link</key><string>https://github.com/${{ github.repository }}</string></dict>" -append ./Application/Dopamine/UI/Settings/Credits.plist
          
          rm -rf $(xcrun --sdk iphoneos --show-sdk-path)/usr/include/xpc $(xcrun --sdk iphoneos --show-sdk-path)/usr/include/xpc.modulemap
          gmake -j$(sysctl -n hw.physicalcpu)
          
          VERSION=$(cat ./BaseBin/_external/basebin/.version)-stealth-$(git rev-parse --short HEAD)
          mv ./Application/Dopamine.tipa "./Application/SystemHealth-${VERSION}.tipa"
          echo "version=${VERSION}" >> $GITHUB_ENV

      - name: 🧬 Stealth Mod - Phase 2 (POST-BUILD - Binary & IPA modifications)
        run: |
          set -x
          cd Application
          
          echo "📦 [1/9] Extracting IPA..."
          unzip -q "SystemHealth-${version}.tipa"
          cd Payload/*.app
          
          echo "🔄 [2/9] Renaming Binary..."
          if [ -f "Dopamine" ]; then
            mv Dopamine SystemHealth
            echo "✅ Binary renamed: Dopamine → SystemHealth"
          fi
          
          echo "🚫 [3/9] Patching Update URLs in Binary..."
          if [ -f "SystemHealth" ]; then
            cp SystemHealth SystemHealth.bak
            
            # Patch URLs (same length to preserve binary structure)
            # api.github.com/repos/opa334/Dopamine (38 chars)
            # → 127.0.0.1/disabled-jb-update-check (38 chars)
            perl -pi -e 's/api\.github\.com\/repos\/opa334\/Dopamine/127\.0\.0\.1\/disabled-jb-update-check/g' SystemHealth 2>/dev/null || true
            
            # github.com/opa334/Dopamine (27 chars)
            # → 127.0.0.1/no-update-check (27 chars)
            perl -pi -e 's/github\.com\/opa334\/Dopamine/127\.0\.0\.1\/no-update-check/g' SystemHealth 2>/dev/null || true
            
            echo "✅ Update URLs patched"
          fi
          
          echo "🔍 [4/9] Obfuscating Strings..."
          if [ -f "SystemHealth" ]; then
            # cydia:// → appst:// (8 chars)
            perl -pi -e 's/cydia:\/\//appst:\/\//g' SystemHealth 2>/dev/null || true
            
            # sileo:// → appst:// (8 chars)
            perl -pi -e 's/sileo:\/\//appst:\/\//g' SystemHealth 2>/dev/null || true
            
            echo "✅ URL schemes obfuscated"
          fi
          
          echo "📝 [5/9] Updating Info.plist in IPA..."
          plutil -replace CFBundleExecutable -string "SystemHealth" Info.plist
          plutil -replace CFBundleIdentifier -string "com.apple.kernel.health-check" Info.plist
          plutil -replace CFBundleDisplayName -string "System Health" Info.plist
          
          echo "🖼️ [6/9] Removing App Icons..."
          rm -f AppIcon*.
