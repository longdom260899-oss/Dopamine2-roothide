name: Build Dopamine Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout
        run: |
          git clone --recursive https://github.com/roothide/Dopamine2-roothide ${{ github.workspace }}
          
      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make xz

      - name: Install THEOS (FIXED)
        run: |
          set -ex
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          
          # Clone Theos
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          
          # Download SDK
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          
          # Extract SDK (FIX: Dùng tar trực tiếp, không dùng gunzip)
          echo "Extracting SDK..."
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks
          
          # Cleanup
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          
          # Verify
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "✅ SDK extracted successfully"
            ls -la $THEOS/sdks/
          else
            echo "❌ SDK extraction failed"
            exit 1
          fi

      - name: Build trustcache
        run: |
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j$(sysctl -n hw.physicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/
          sudo chmod +x /opt/procursus/bin/trustcache

      - name: Install libarchive
        run: brew install libarchive

      - name: Build
        run: |
          set -ex
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          
          # Add credits
          typeset itemcount=$(plutil -extract items raw -expect array ./Application/Dopamine/UI/Settings/Credits.plist)
          for ((i=0; i<$itemcount; i++)); do 
            if [ "$(plutil -extract items.$i.headerCellClass raw ./Application/Dopamine/UI/Settings/Credits.plist)" = "DOCreditsCell" ]; then 
              DOCreditsCellIndex=$i
              break
            fi
          done
          plutil -insert items.$DOCreditsCellIndex.names -xml "<dict><key>name</key><string>${{ github.actor }}</string><key>link</key><string>https://github.com/${{ github.repository }}</string></dict>" -append ./Application/Dopamine/UI/Settings/Credits.plist
          
          # Remove xpc
          rm -rf $(xcrun --sdk iphoneos --show-sdk-path)/usr/include/xpc $(xcrun --sdk iphoneos --show-sdk-path)/usr/include/xpc.modulemap
          
          # Build
          gmake -j$(sysctl -n hw.physicalcpu)
          
          VERSION=$(cat ./BaseBin/_external/basebin/.version)-stealth-$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> $GITHUB_ENV
          
          echo "✅ Build completed!"

      - name: Apply Stealth Modifications
        run: |
          set -ex
          cd Application
          
          echo "📦 Extracting IPA..."
          unzip -q Dopamine.tipa
          
          APP_PATH=$(find Payload -name "*.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          
          echo "🎭 Modifying Info.plist..."
          plutil -replace CFBundleIdentifier -string "com.apple.kernel.health-check" "$APP_PATH/Info.plist"
          plutil -replace CFBundleDisplayName -string "System Health" "$APP_PATH/Info.plist"
          plutil -replace CFBundleName -string "System Health" "$APP_PATH/Info.plist"
          plutil -remove CFBundleURLTypes "$APP_PATH/Info.plist" 2>/dev/null || true
          
          echo "🔍 Verifying..."
          plutil -p "$APP_PATH/Info.plist" | grep -E "(CFBundleIdentifier|CFBundleDisplayName)"
          
          echo "🗑️  Removing old signature..."
          rm -rf "$APP_PATH/_CodeSignature"
          
          echo "📦 Repackaging..."
          rm Dopamine.tipa
          zip -qr "SystemHealth-${version}.tipa" Payload
          
          rm -rf Payload
          
          echo "✅ Done!"
        env:
          version: ${{ env.version }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SystemHealth-${{ env.version }}
          path: Application/SystemHealth-${{ env.version }}.tipa
