name: Build Stealth JB

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: roothide/Dopamine2-roothide
          submodules: recursive

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install THEOS
        run: |
          export THEOS="${PWD}/theos"
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o sdk.tar.xz
          tar -xJf sdk.tar.xz -C $THEOS/sdks

      - name: Build trustcache
        run: |
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="-I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="-L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j$(sysctl -n hw.physicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Build BaseBin
        run: |
          export THEOS="${PWD}/theos"
          cd basebinaries
          gmake -j$(sysctl -n hw.physicalcpu)
          cd ..

      - name: Build Dopamine
        run: |
          export THEOS="${PWD}/theos"
          gmake -j$(sysctl -n hw.physicalcpu)

      - name: Advanced Stealth Modification
        run: |
          cd Application
          unzip -q Dopamine.tipa
          cd Payload/*.app
          
          echo "=== PHASE 1: Identity Masking ==="
          plutil -replace CFBundleIdentifier -string "com.apple.kernel.health-check" Info.plist
          plutil -replace CFBundleDisplayName -string "System Health" Info.plist
          plutil -replace CFBundleName -string "System Health" Info.plist
          
          echo "=== PHASE 2: Remove Visual Traces ==="
          rm -f AppIcon*.png
          
          echo "=== PHASE 3: Remove URL Schemes (Anti-Detection) ==="
          plutil -remove CFBundleURLTypes Info.plist 2>/dev/null || echo "No URL schemes found"
          
          echo "=== PHASE 4: Fake System Version ==="
          plutil -replace CFBundleVersion -string "1.0" Info.plist
          plutil -replace CFBundleShortVersionString -string "1.0" Info.plist
          
          echo "=== PHASE 5: Remove Jailbreak Metadata ==="
          plutil -remove UIBackgroundModes Info.plist 2>/dev/null || true
          plutil -remove LSApplicationQueriesSchemes Info.plist 2>/dev/null || true
          
          echo "=== PHASE 6: Fake Minimum OS (Look Like System App) ==="
          plutil -replace MinimumOSVersion -string "15.0" Info.plist
          
          echo "=== PHASE 7: Package ==="
          cd ../..
          zip -qr SystemHealth.tipa Payload
          
          echo "=== BUILD SUCCESS ==="
          ls -lh SystemHealth.tipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemHealth-Stealth
          path: Application/SystemHealth.tipa
          retention-days: 30
