name: Build Dopamine Stealth - WORKING for iOS 15.8.7

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        run: |
          set -x
          git clone --recursive https://github.com/roothide/Dopamine2-roothide ${{ github.workspace }}
          
      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install THEOS
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar
          cd $BASEDIR

      - name: Build and Install trustcache
        run: |
          set -x
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j$(sysctl -n hw.physicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Install libarchive
        run: |
          brew install libarchive

      - name: 🎭 MINIMAL Stealth Mod - Info.plist ONLY
        run: |
          set -x
          
          PLIST="./Application/Dopamine/Info.plist"
          
          echo "🎭 [1/3] Changing Bundle ID..."
          plutil -replace CFBundleIdentifier -string "com.apple.kernel.health-check" $PLIST
          
          echo "🎭 [2/3] Changing Display Name..."
          plutil -replace CFBundleDisplayName -string "System Health" $PLIST
          plutil -replace CFBundleName -string "System Health" $PLIST
          
          echo "🎭 [3/3] Removing URL Schemes..."
          plutil -remove CFBundleURLTypes $PLIST 2>/dev/null || true
          
          echo "⚠️  KHÔNG ĐỔI VERSION - Giữ nguyên để BaseBin hoạt động!"
          echo "⚠️  KHÔNG SỬA BINARY - Giữ nguyên để exploit hoạt động!"
          
          echo "✅ Done - Minimal changes only"

      - name: Build (Includes BaseBin)
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          
          typeset itemcount=$(plutil -extract items raw -expect array ./Application/Dopamine/UI/Settings/Credits.plist)
          for ((i=0; i<$itemcount; i++)); do 
            if [ "$(plutil -extract items.$i.headerCellClass raw ./Application/Dopamine/UI/Settings/Credits.plist)" = "DOCreditsCell" ]; then 
              DOCreditsCellIndex=$i
              break
            fi
          done
          plutil -insert items.$DOCreditsCellIndex.names -xml "<dict><key>name</key><string>${{ github.actor }}</string><key>link</key><string>https://github.com/${{ github.repository }}</string></dict>" -append ./Application/Dopamine/UI/Settings/Credits.plist
          
          rm -rf $(xcrun --sdk iphoneos --show-sdk-path)/usr/include/xpc $(xcrun --sdk iphoneos --show-sdk-path)/usr/include/xpc.modulemap
          gmake -j$(sysctl -n hw.physicalcpu)
          
          VERSION=$(cat ./BaseBin/_external/basebin/.version)-stealth-$(git rev-parse --short HEAD)
          mv ./Application/Dopamine.tipa "./Application/SystemHealth-${VERSION}.tipa"
          echo "version=${VERSION}" >> $GITHUB_ENV

      - name: ✅ Verify Build
        run: |
          cd Application
          echo "📦 Checking built IPA..."
          
          unzip -q "SystemHealth-${version}.tipa"
          cd Payload/*.app
          
          echo "🔍 Checking Info.plist..."
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw Info.plist)
          DISPLAY_NAME=$(plutil -extract CFBundleDisplayName raw Info.plist)
          VERSION_SHORT=$(plutil -extract CFBundleShortVersionString raw Info.plist)
          
          echo "Bundle ID: $BUNDLE_ID"
          echo "Display Name: $DISPLAY_NAME"
          echo "Version: $VERSION_SHORT"
          
          if [ "$BUNDLE_ID" = "com.apple.kernel.health-check" ] && [ "$DISPLAY_NAME" = "System Health" ]; then
            echo "✅ Info.plist OK"
          else
            echo "❌ Info.plist verification failed!"
            exit 1
          fi
          
          echo "🔍 Checking binary..."
          if [ -f "Dopamine" ]; then
            echo "✅ Binary exists: Dopamine"
            file Dopamine
          else
            echo "❌ Binary not found!"
            exit 1
          fi
          
          echo "🔍 Checking entitlements..."
          ldid -e Dopamine > ent.xml
          if grep -q "platform-application" ent.xml; then
            echo "✅ Entitlements OK"
          else
            echo "❌ Missing critical entitlements!"
            exit 1
          fi
          
          cd ../..
          rm -rf Payload
          
          echo "✅ BUILD VERIFICATION PASSED!"
        env:
          version: ${{ env.version }}

      - name: 📊 Generate Report
        run: |
          cat > Application/INSTALL_GUIDE.md <<'EOF'
          # 🎯 SystemHealth - Stealth Dopamine Build
          
          ## ✅ ĐÃ SỬA:
          - Bundle ID: `com.apple.kernel.health-check`
          - Display Name: System Health
          - Xóa URL Schemes (cydia://, sileo://)
          
          ## ⚠️ KHÔNG SỬA (Để giữ ổn định):
          - ✅ Version numbers (giữ nguyên)
          - ✅ Binary (không patch)
          - ✅ Entitlements (giữ nguyên)
          - ✅ BaseBin (không động đến)
          
          ## 📱 CÀI ĐẶT:
          
          ### Cách 1: TrollStore (Khuyên dùng)
          ```
          1. Chuyển file .tipa vào iPhone
          2. TrollStore → Install
          3. Mở app → Jailbreak
          ```
          
          ### Cách 2: AltStore/Sideloadly
          ```
          1. Kết nối iPhone qua USB
          2. Install file .tipa
          3. Trust certificate
          4. Mở app → Jailbreak
          ```
          
          ## 🎭 ĐỂ BYPASS BANKING APP:
          
          **SAU KHI JAILBREAK THÀNH CÔNG:**
          
          ### Option 1: Shadow ($2.99) ⭐⭐⭐⭐⭐
          ```
          Repo: https://ios.jjolano.me
          
          Settings → Shadow → [Banking App]
          ☑️ Hide Jailbreak
          ☑️ Custom Whitelist:
              ✓ Crane
              ✓ VBox
          ```
          
          ### Option 2: A-Bypass (Free) ⭐⭐⭐⭐
          ```
          Repo: https://repo.co.kr
          
          Mở A-Bypass app
          → Toggle ON cho banking app
          ```
          
          ### Option 3: Hestia (Free - Tốt cho banking VN) ⭐⭐⭐⭐
          ```
          Repo: https://repo.incendo.ws
          
          Settings → Hestia
          → Thêm banking app vào blacklist
          ```
          
          ## 🚀 ĐỂ DÙNG CRANE/VBOX:
          
          **QUAN TRỌNG:**
          - ❌ KHÔNG bật roothide Manager blacklist cho banking app
          - ✅ Dùng Shadow/A-Bypass/Hestia để hide JB
          - ✅ Crane/VBox sẽ vẫn inject được
          
          ## 🆘 NẾU JAILBREAK FAIL:
          
          ### Lỗi: "Exploiting Kernel failed"
          ```
          → Thử lại 2-3 lần (exploit có thể fail)
          → Airplane mode ON
          → Low Power Mode OFF
          → Đóng tất cả app khác
          ```
          
          ### Lỗi: App crash ngay khi mở
          ```
          → Xóa app
          → Reboot iPhone
          → Cài lại
          ```
          
          ### Vẫn không được:
          ```
          → Dùng bản gốc từ opa334
          → Sau khi JB thành công
          → Dùng AppData tweak để đổi tên app
          ```
          
          ---
          
          **Build date**: $(date)  
          **Version**: ${version}  
          **iOS Support**: 15.0 - 16.6.1 (bao gồm 15.8.7)
          EOF
          
          cat Application/INSTALL_GUIDE.md
        env:
          version: ${{ env.version }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemHealth-Stealth-${{ env.version }}
          path: |
            Application/SystemHealth-${{ env.version }}.tipa
            Application/INSTALL_GUIDE.md
          retention-days: 30
